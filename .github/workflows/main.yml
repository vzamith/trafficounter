name: Build Flet APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python_version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install flet

      - name: Build APK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flet Build APK
        run: |
          # O comando 'flet build apk' gera o pacote Android
          pip install flet-cli
          flet build apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flet-app-apk
          path: build/apk/*.apk
